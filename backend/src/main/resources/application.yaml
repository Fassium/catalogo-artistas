spring:
  application:
    name: catalogo-artistas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogo}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
seguranca:
  jwt:
    chave: ${JWT_CHAVE}
    expiracao-minutos: 5
    emissor: catalogo-artistas-api
