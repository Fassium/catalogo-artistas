# Perfil de desenvolvimento: ativado com SPRING_PROFILES_ACTIVE=dev. Por padrão (sem perfil) o SQL não aparece no log.
spring:
  jpa:
    show-sql: true
# Só em desenvolvimento: 1h para testar e depurar sem o token expirar. O padrão (application.yaml) continua 5 min, como o edital exige.
seguranca:
  jwt:
    expiracao-minutos: 60
