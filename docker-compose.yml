services:
  banco:
    image: postgres:16.15
    container_name: catalogo-banco
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - banco-dados:/var/lib/postgresql/data

volumes:
  banco-dados: